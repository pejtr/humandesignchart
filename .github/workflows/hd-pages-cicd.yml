name: Human Design | Cloudflare Pages (guarded)


# PR revisions supersede one another; main build and production deploys are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/hd-pages-cicd.yml"
      - "client/**"
      - "server/**"
      - "workers/**"
      - "shared/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.*"
      - "tsconfig*.json"
  workflow_dispatch:
    inputs:
      target:
        description: "Preview first; production requires explicit selection"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Keep workers limited to avoid local/CI timeout flakes.
      - run: pnpm exec vitest run --maxWorkers=2 --minWorkers=1
      - name: Build Cloudflare Pages assets and Worker
        env:
          VITE_OPENAI_ADS_PIXEL_ID: ${{ vars.HD_OPENAI_ADS_PIXEL_ID }}
        run: |
          # Missing build-time Pixel configuration must fail, not silently ship.
          if [ -z "${VITE_OPENAI_ADS_PIXEL_ID:-}" ]; then
            echo "::error::Missing HD_OPENAI_ADS_PIXEL_ID repository variable; refusing an untracked build."
            exit 1
          fi
          pnpm build:cloudflare
          # Verify Vite embedded the real ID; the previous bundle silently contained import.meta.env = {}.
          if ! grep -Fq -- "$VITE_OPENAI_ADS_PIXEL_ID" dist/public/assets/*.js; then
            echo "::error::OpenAI Ads Pixel ID absent from the compiled browser assets."
            exit 1
          fi
      - name: Assert artifact is deployable
        run: test -s dist/public/index.html && test -s dist/public/_worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: human-design-pages-dist
          path: dist/public/
          if-no-files-found: error
          retention-days: 5

  deploy-preview:
    name: Deploy preview only
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/download-artifact@v4
        with:
          name: human-design-pages-dist
          path: dist/public
      - name: Normalize and validate Cloudflare deploy credentials
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          if not os.environ.get("CF_ACCOUNT"):
              sys.exit("Missing CLOUDFLARE_ACCOUNT_ID repository variable")
          token = os.environ.get("CF_API", "").strip()
          # A pasted "Bearer TOKEN" or quoted value otherwise produces
          # Cloudflare's opaque Authorization header error 6111.
          if token.lower().startswith("bearer "):
              token = token[7:].strip()
          if len(token) >= 2 and token[0] == token[-1] and token[0] in ('"', "'"):
              token = token[1:-1].strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]{30,256}", token):
              sys.exit("Invalid CLOUDFLARE_API_TOKEN format. Save only the raw scoped API token, without Bearer, JSON or curl syntax.")
          # Mask the derived token before passing it to the next action.
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envfile:
              envfile.write(f"CF_API_TOKEN_NORMALIZED={token}\n")
          PY
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_API_TOKEN_NORMALIZED }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=humandesignchart-web --branch=hd-ci-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    name: Deploy production (explicitly gated)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
      || (github.event_name == 'push' && vars.HD_PAGES_DEPLOY_ENABLED == 'true')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: human-design-cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/download-artifact@v4
        with:
          name: human-design-pages-dist
          path: dist/public
      - name: Normalize and validate Cloudflare deploy credentials
        env:
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          if not os.environ.get("CF_ACCOUNT"):
              sys.exit("Missing CLOUDFLARE_ACCOUNT_ID repository variable")
          token = os.environ.get("CF_API", "").strip()
          # A pasted "Bearer TOKEN" or quoted value otherwise produces
          # Cloudflare's opaque Authorization header error 6111.
          if token.lower().startswith("bearer "):
              token = token[7:].strip()
          if len(token) >= 2 and token[0] == token[-1] and token[0] in ('"', "'"):
              token = token[1:-1].strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]{30,256}", token):
              sys.exit("Invalid CLOUDFLARE_API_TOKEN format. Save only the raw scoped API token, without Bearer, JSON or curl syntax.")
          # Mask the derived token before passing it to the next action.
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envfile:
              envfile.write(f"CF_API_TOKEN_NORMALIZED={token}\n")
          PY
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_API_TOKEN_NORMALIZED }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=humandesignchart-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
