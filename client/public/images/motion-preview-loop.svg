<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img">
<title>ZEN to FLOW — silent illustrative 15 second loop</title>
<defs>
<radialGradient id="space"><stop stop-color="#242848"/><stop offset="1" stop-color="#0e1020"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8C49A"/><stop offset="1" stop-color="#8899ff"/></linearGradient>
</defs>
<style>
  .energy { stroke-dasharray:5 22;animation: glide 15s linear infinite; }
  .flow { animation: flowPhase 15s ease-in-out infinite; }
  .zen { animation: zenPhase 15s ease-in-out infinite; }
  .glow {animation: breathe 15s ease-in-out infinite}
  @keyframes glide {
    0% { stroke-dashoffset:0;opacity:.22 }
    46% { stroke-dashoffset:-15;opacity:.22 }
    51% { stroke-dashoffset:-20;opacity:.65 }
    95% { stroke-dashoffset:-146;opacity:.65 }
    100% { stroke-dashoffset:-151;opacity:.22 }
  }
  @keyframes zenPhase { 0%,46% {opacity:1} 50%,95% {opacity:.34} 100%{opacity:1} }
  @keyframes flowPhase { 0%,46% {opacity:.25} 50%,95% {opacity:1} 100%{opacity:.25} }
  @keyframes breathe { 0%,46%,100% {opacity:.3} 50%,95% {opacity:.66} }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none!important; }
    .flow {opacity:.6}
    .zen {opacity:1}
    .energy {opacity:0}
  }
</style>
<rect width="900" height="440" fill="url(#space)"/>
<rect x="25" y="25" width="850" height="390" rx="27" fill="none" stroke="#D8C49A" stroke-opacity=".3"/>
<text x="60" y="81" fill="#D8C49A" font-family="sans-serif" font-size="13" letter-spacing="4">HUMAN DESIGN / LIVE PREVIEW</text>
<text x="60" y="153" fill="#f4f2fb" font-family="serif" font-size="45">Two rhythms.</text>
<text x="60" y="204" fill="#f4f2fb" font-family="serif" font-size="45">One quiet space.</text>
<text x="60" y="270" fill="#aeb2cc" font-family="sans-serif" font-size="16">Pause the movement, keep the insight.</text>
<g transform="translate(475 27)">
 <circle cx="195" cy="195" r="171" fill="none" stroke="#8899ff" stroke-opacity=".28"/>
 <circle cx="195" cy="195" r="143" fill="#8899ff" fill-opacity=".08" class="glow"/>
 <g fill="none" stroke="#D8C49A" stroke-opacity=".45" stroke-width="4">
  <path d="M195 40V95M195 124V179M195 216V270M195 305V354M195 200L135 282M195 200L257 282M135 282L195 324M257 282L195 324"/>
 </g>
 <g class="energy" fill="none" stroke="#8899ff" stroke-width="4" stroke-linecap="round">
  <path d="M195 40V354M195 200L135 282M195 200L257 282"/>
 </g>
 <path d="M195 30L158 79H232Z" fill="#D8C49A" fill-opacity=".73" stroke="#f1e3c3"/>
 <path d="M195 94L164 124L195 155L226 124Z" fill="#8899ff" fill-opacity=".56" stroke="#bbc6ff"/>
 <rect x="164" y="185" width="62" height="55" rx="10" fill="#D8C49A" fill-opacity=".73" stroke="#f1e3c3"/>
 <path d="M195 258L159 311H231Z" fill="#8899ff" fill-opacity=".58" stroke="#bbc6ff"/>
 <rect x="163" y="330" width="64" height="48" rx="11" fill="#D8C49A" fill-opacity=".70" stroke="#f1e3c3"/>
</g>
<g transform="translate(62 322)">
 <rect width="282" height="55" rx="27" fill="#0e1020" stroke="#D8C49A" stroke-opacity=".55"/>
 <circle cx="31" cy="27" r="17" fill="#D8C49A"/>
 <path d="M26 18L38 27L26 36Z" fill="#0e1020"/>
 <g class="zen"><rect x="63" y="8" width="101" height="39" rx="19" fill="#D8C49A"/><text x="91" y="33" font-size="16" font-family="sans-serif" fill="#0e1020" font-weight="bold">ZEN</text></g>
 <g class="flow"><rect x="171" y="8" width="104" height="39" rx="19" fill="#8899ff"/><text x="195" y="33" font-size="16" font-family="sans-serif" fill="#0e1020" font-weight="bold">FLOW</text></g>
</g>
</svg>